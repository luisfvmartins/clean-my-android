# Proposta de atualização para .github/workflows/contribution-dashboard.yml (Opção B)
# Abre Pull Request em vez de efetuar git push direto na main, respeitando a proteção de branch.

name: Atualizar painel de contribuições (via PR)

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: contribution-dashboard
  cancel-in-progress: false

jobs:
  update:
    name: Atualizar indicadores de contribuição
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.12"

      - name: Gerar painel com dados da API GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/generate_contribution_dashboard.py

      - name: Criar Pull Request se houver alterações
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/EVOLUCAO_CONTRIBUICOES.md docs/EVOLUCAO_CONTRIBUICOES.en.md; then
            echo "Painel já está atualizado. Nenhuma PR necessária."
            exit 0
          fi
          BRANCH_NAME="automation/update-dashboard-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add docs/EVOLUCAO_CONTRIBUICOES.md docs/EVOLUCAO_CONTRIBUICOES.en.md
          git commit -m "chore: update contribution evolution dashboard"
          git push -u origin "$BRANCH_NAME"
          gh pr create \
            --title "chore: update contribution dashboard ($(date +%Y-%m-%d))" \
            --body "Atualização automatizada periódica dos indicadores de contribuição do repositório." \
            --base main \
            --head "$BRANCH_NAME"
