# Proposta de atualização para .github/workflows/validate.yml
# Implementa a matriz completa de CI (Ubuntu + macOS bash 3.2 + shellcheck)
# Pendência humana para Luís: aplicar este conteúdo em .github/workflows/validate.yml e commitar/pushar
# com credenciais que tenham o escopo 'workflow'.

name: Validação do repositório

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Verificação estática (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Executar ShellCheck nos scripts Bash
        run: shellcheck -x scripts/*.sh scripts/lib/*.sh

  validate:
    name: Validação e Testes (${{ matrix.os }} - Python ${{ matrix.python-version }})
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            shell_name: "bash"
          - os: ubuntu-latest
            python-version: "3.12"
            shell_name: "bash"
          - os: ubuntu-latest
            python-version: "3.13"
            shell_name: "bash"
          - os: macos-latest
            python-version: "3.12"
            shell_name: "/bin/bash"
    defaults:
      run:
        shell: ${{ matrix.shell_name }}
    steps:
      - name: Obter código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Exibir versão do Bash em execução
        run: |
          echo "Bash binary: $BASH"
          echo "Bash version: $BASH_VERSION"

      - name: Executar suíte completa de testes unitários
        run: python3 -m unittest discover -s tests -v

      - name: Validar integridade e consistência do repositório
        run: python3 scripts/validate_repository.py
