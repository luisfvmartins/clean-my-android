name: Atualizar painel de contribuições

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: contribution-dashboard
  cancel-in-progress: false

jobs:
  update:
    name: Atualizar indicadores de contribuição
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Gerar painel com dados da API GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/generate_contribution_dashboard.py

      - name: Publicar atualização
        run: |
          if git diff --quiet -- docs/EVOLUCAO_CONTRIBUICOES.md docs/EVOLUCAO_CONTRIBUICOES.en.md; then
            echo "Painel já está atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/EVOLUCAO_CONTRIBUICOES.md docs/EVOLUCAO_CONTRIBUICOES.en.md
          git commit -m "chore: update contribution dashboard"
          git push
