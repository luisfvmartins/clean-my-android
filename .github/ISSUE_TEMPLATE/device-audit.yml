name: Request a device audit
description: Suggest or report an audit for an Android device
title: "[AUDIT] Manufacturer Model — Android"
body:
  - type: markdown
    attributes:
      value: |
        Use this form to suggest a device or discuss an audit. If you already have sanitized reports and evidence, please submit a Pull Request following [CONTRIBUTING.md](https://github.com/luisfvmartins/clean-my-android/blob/main/CONTRIBUTING.md).
  - type: input
    id: device
    attributes:
      label: Manufacturer and model
      placeholder: Motorola Edge 60 Pro (XT2507-1)
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version, ROM, and interface
      placeholder: Android 16, stock ROM / manufacturer interface
    validations:
      required: false
  - type: input
    id: codename
    attributes:
      label: Device codename (if known)
      placeholder: codename
    validations:
      required: false
  - type: dropdown
    id: goal
    attributes:
      label: Goal
      options:
        - I want to start an audit
        - I have an audit ready to contribute
        - I need to correct or supplement an existing report
        - I want to report a security or compatibility issue
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe the context, what has already been collected, and any questions. Do not include personal data, raw dumps, identifiers, or credentials.
      placeholder: Describe the scenario and available evidence.
    validations:
      required: true
